<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia — Host</title>
  <meta name="theme-color" content="#0b1020" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="stylesheet" href="../assets/brand.css" />
  <style>
    body { background: #0b1020; color: #eaf0ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .head img { width: 48px; height: 48px; }
    .head h1 { font-size: 22px; margin: 0; }
    .card { background: #121a30; border: 1px solid #2a3860; border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    .card h2 { font-size: 16px; margin: 0 0 12px; color: #9ec5ff; text-transform: uppercase; letter-spacing: .5px; }
    .qcard { background: #0e1527; border: 1px solid #27345c; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .qcard-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .qnum { font-weight: 800; color: #9ec5ff; }
    .field { width: 100%; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid #2a3860;
      background: #0b1020; color: #fff; margin: 4px 0; }
    .field.inline { flex: 1; margin: 0; }
    .field.tiny { width: 76px; }
    .choice-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .choice-letter { width: 26px; height: 26px; border-radius: 7px; color: #fff; font-weight: 900;
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .qtime { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: #9fb2d8; flex-wrap: wrap; }
    .btn { font-size: 15px; font-weight: 700; padding: 11px 16px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; }
    .btn.primary { background: linear-gradient(180deg,#3aa0ff,#2b7fe0); }
    .btn.ghost { background: #26314f; }
    .btn.sm { padding: 6px 12px; font-size: 13px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .status { font-weight: 700; margin: 2px 0 10px; }
    .join { font-size: 13px; color: #9fb2d8; word-break: break-all; margin-bottom: 10px; }
    .tv-hint { color: #7a89ad; font-size: 13px; }
    .lb-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
      background: #0e1527; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
    .lb-rk { color: #ffd369; font-weight: 900; text-align: center; }
    .lb-nm { font-weight: 700; }
    .lb-sc { font-weight: 900; color: #9ec5ff; }
    .links a { color: #7ab8ff; font-size: 13px; margin-right: 14px; }
    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1b2a4a;
      color: #fff; padding: 12px 18px; border-radius: 12px; opacity: 0; transition: opacity .2s;
      pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <img src="../assets/logo.png" alt="Balance Gaming FL" />
      <h1>Trivia — Host</h1>
    </div>

    <div class="card">
      <h2>Run the game</h2>
      <div class="status" id="gameStatus">…</div>
      <div class="join" id="joinInfo"></div>
      <div class="btn-row">
        <button class="btn primary" id="gNew" type="button">New game / open lobby</button>
        <button class="btn primary" id="gStart" type="button">Start questions</button>
        <button class="btn ghost" id="gReveal" type="button">Reveal answer</button>
        <button class="btn ghost" id="gNext" type="button">Next question ▶</button>
        <button class="btn ghost" id="gEnd" type="button">End game</button>
      </div>
      <div class="links" style="margin-top:12px">
        <a href="board.html" target="_blank" rel="noopener">Open TV board ↗</a>
        <a href="play.html" target="_blank" rel="noopener">Open a player view ↗</a>
      </div>
      <div style="margin-top:14px"><div class="tv-hint">Players / leaderboard</div><div id="hostPlayers"></div></div>
    </div>

    <div class="card">
      <h2>Question bank</h2>
      <div id="qbank"></div>
      <div class="btn-row">
        <button class="btn ghost" id="qAdd" type="button">+ Add question</button>
        <button class="btn primary" id="qSave" type="button">Save bank</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    (function () {
      var t = Date.now();
      ["../assets/app.js", "../assets/trivia.js"].forEach(function (s) {
        document.write('<scr' + 'ipt src="' + s + '?t=' + t + '"><\/scr' + 'ipt>');
      });
    })();
  </script>
  <script>
    (function boot() {
      if (!window.BGF || !window.Trivia) { setTimeout(boot, 60); return; }
      Trivia.config();
    })();
  </script>
</body>
</html>
