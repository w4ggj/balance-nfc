<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Board — Balance Gaming FL</title>
  <meta name="theme-color" content="#0b0d10" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script>document.write('<link rel="stylesheet" href="assets/tom.css?t=' + Date.now() + '">');</script>
</head>
<body class="tom wall">
  <!-- Split board: pairings (left) + standings (right) on screen at once, no
       flipping. ?demo=1 previews the sample. -->
  <header class="tom-header" id="hdr"></header>
  <main class="board" id="board"></main>
  <footer class="tom-foot" id="foot"></footer>
  <p class="credit">Designed by <a href="https://tavaone.com" target="_blank" rel="noopener">Tava One LLC</a></p>

  <script>(function () { var t = Date.now(); ["assets/app.js", "assets/tom.js"].forEach(function (s) { document.write('<scr' + 'ipt src="' + s + '?t=' + t + '"><\/scr' + 'ipt>'); }); })();</script>
  <script>
    TOM.initBoardSplit();
    // Unattended kiosk: reload every ~20 min so it re-picks the latest event,
    // pulls code updates, and frees Chromium memory on low-RAM devices.
    setTimeout(function () { try { location.reload(); } catch (e) {} }, 20 * 60 * 1000);
  </script>
</body>
</html>
