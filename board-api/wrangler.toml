name = "board-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Non-secret settings — safe to keep here.
[vars]
ALLOW_ORIGIN            = "https://nfc.balancegamingfl.com"
TIMEZONE               = "America/New_York"
HORIZON_DAYS           = "56"
ALMOST_FULL            = "3"
EVENTS_COLLECTION_HANDLE = "events"
