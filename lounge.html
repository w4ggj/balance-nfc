<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lounge Display</title>
  <meta name="theme-color" content="#0b0d10" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    :root { --bg: #0b0d10; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }
    #stage {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); overflow: hidden;
    }
    /* Fill the screen but never crop content; swap object-fit to cover if you'd
       rather fill edge-to-edge (via ?fit=cover). */
    #img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: none; }
    body[data-fit="cover"] #img { width: 100%; height: 100%; object-fit: cover; }

    /* Portrait TV on a landscape-only device (Fire Stick): rotate the whole
       stage in the browser — ?rotate=ccw (or =cw if upside down). */
    body[data-rotate="ccw"] #stage,
    body[data-rotate="cw"]  #stage { position: absolute; width: 100vh; height: 100vw; overflow: hidden; transform-origin: top left; }
    body[data-rotate="ccw"] #stage { top: 100vh; left: 0; transform: rotate(-90deg); }
    body[data-rotate="cw"]  #stage { top: 0; left: 100vw; transform: rotate(90deg); }

    #empty {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 3vh; text-align: center;
      color: #9aa2ad; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8vw;
    }
    #empty img { width: 34vh; max-width: 60%; height: auto; opacity: .95; }
    #empty .t { font-size: clamp(18px, 3.4vw, 34px); font-weight: 800; color: #f3f5f8; }
    #empty .s { font-size: clamp(13px, 2vw, 20px); }
  </style>
</head>
<body>
  <div id="stage"><img id="img" alt="" /></div>
  <div id="empty">
    <img src="assets/logo.png" alt="Balance Gaming FL" />
    <div class="t">Lounge Display</div>
    <div class="s">Add images in the control panel → Lounge TV.</div>
  </div>

  <script>document.write('<scr' + 'ipt src="assets/app.js?t=' + Date.now() + '"><\/scr' + 'ipt>');</script>
  <script>
  (function () {
    function boot() {
      if (!window.BGF) { setTimeout(boot, 60); return; }
      var img = document.getElementById("img");
      var empty = document.getElementById("empty");
      var params = new URLSearchParams(location.search);
      var rot = params.get("rotate");
      if (rot === "cw" || rot === "ccw") document.body.setAttribute("data-rotate", rot);
      if (params.get("fit") === "cover") document.body.setAttribute("data-fit", "cover");

      var imgs = [], idx = 0, sig = "", intervalMs = 10000, timer = null;

      function show() {
        if (!imgs.length) { img.style.display = "none"; img.removeAttribute("src"); empty.style.display = "flex"; return; }
        empty.style.display = "none"; img.style.display = "block";
        if (idx < 0 || idx >= imgs.length) idx = 0;
        var url = imgs[idx];
        if (img.getAttribute("src") !== url) img.src = url;
      }
      function advance() { if (imgs.length > 1) { idx = (idx + 1) % imgs.length; show(); } scheduleNext(); }
      function scheduleNext() { clearTimeout(timer); timer = setTimeout(advance, intervalMs); }

      function load() {
        BGF.fbGet("lounge").then(function (l) {
          l = l || {};
          var list = Array.isArray(l.images) ? l.images.filter(Boolean) : [];
          if (typeof l.seconds === "number" && l.seconds >= 2) intervalMs = l.seconds * 1000;
          var newSig = JSON.stringify(list);
          if (newSig !== sig) {
            sig = newSig; imgs = list;
            if (idx >= imgs.length) idx = 0;
            show(); scheduleNext();   // restart the rotation on a content change
          }
        }).catch(function () {});
      }

      load();
      setInterval(load, 15000);   // poll so new images pushed from config appear
      scheduleNext();
      // Unattended kiosk: reload every ~20 min to free memory on low-RAM sticks.
      setTimeout(function () { try { location.reload(); } catch (e) {} }, 20 * 60 * 1000);
    }
    boot();
  })();
  </script>
</body>
</html>
